name: Check
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: deno task check
      - run: npm run test:database
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm --dir frontend --ignore-workspace install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm --dir frontend --ignore-workspace typecheck
      - run: pnpm --dir frontend --ignore-workspace exec vitest run src/api/__tests__
      - run: pnpm --dir frontend --ignore-workspace build
      - uses: docker/setup-buildx-action@v3
      - name: Build console image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sub2api-cloud:check
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console

  management:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: ${{ github.workspace }}
      - run: go build ./cmd/server
      - run: go test ./cmd/export-codex-catalog
      - name: Verify original Codex catalog templates
        working-directory: ${{ github.workspace }}
        run: node scripts/generate-codex-catalog.mjs --check
      - name: Verify original Antigravity mapping rules
        working-directory: ${{ github.workspace }}
        run: node scripts/generate-antigravity-mapping.mjs --check
      - name: Verify provider profiles
        working-directory: ${{ github.workspace }}
        run: node scripts/generate-provider-profiles.mjs --check

      - name: Verify native management and cloud gateway integration
        working-directory: ${{ github.workspace }}
        env:
          S2A_AUTH_ACCEPTANCE_FIXTURE: '1'
          S2A_ACCOUNT_VAULT: '1'
          S2A_PERSONAL_HTTP: '1'
          S2A_POSTGRES_IMAGE: public.ecr.aws/supabase/postgres:17.11.0.003
          S2A_MANAGEMENT_BINARY: ${{ github.workspace }}/backend/server
        run: |
          if ! docker pull "$S2A_POSTGRES_IMAGE"; then
            docker pull supabase/postgres:17.11.0.003
            docker tag supabase/postgres:17.11.0.003 "$S2A_POSTGRES_IMAGE"
          fi
          docker pull redis:8-alpine
          mkdir -p .local
          node scripts/accept-management.mjs
      - run: go test -tags=unit ./internal/config ./internal/server/middleware
      - run: go test -tags=unit ./internal/pkg/geminicli ./internal/pkg/antigravity
      - run: go test -tags=unit ./internal/service -run 'Test(Supabase|LocalGatewayWorkerOwnership|AuthService_ValidateToken|GeminiOAuthService|AccountCredentialExpiryFormats)'
      - run: go test ./internal/repository -run 'Test(SupabaseMigrationRole|ApplyMigrations)'
      - run: go test ./cmd/server -run TestManagementMigrationURL
      - uses: docker/setup-buildx-action@v3
      - name: Build management image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: sub2api-cloud-management:check
          cache-from: type=gha,scope=management
          cache-to: type=gha,mode=max,scope=management
