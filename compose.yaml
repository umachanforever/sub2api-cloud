services:
  console:
    build: .
    image: sub2api-supabase-console:latest
    container_name: sub2api-supabase-console
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-3000}:4173"
      - "127.0.0.1:1455:1455"
    environment:
      MANAGEMENT_URL: ${MANAGEMENT_URL:-http://host.docker.internal:8080}
      SUPABASE_MODE: ${SUPABASE_MODE:-cloud}
      SUPABASE_URL: ${SUPABASE_URL:?Fill .env.local first}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Fill .env.local first}
      SUPABASE_AUTH_REDIRECT_URL: ${SUPABASE_AUTH_REDIRECT_URL:-http://127.0.0.1:3000/reset-password}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
