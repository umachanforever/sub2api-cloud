<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>用量查询</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./usage.js"></script>
</head>
<body>
  <main>
    <header><div><h1>用量查询</h1><p id="timezone"></p></div><label>时间显示 <select id="zone"><option value="local">当地时间</option><option value="UTC">UTC</option></select></label></header>
    <form id="credentials"><label for="key">只读用量密钥</label><div class="controls"><input id="key" type="password" autocomplete="off" required placeholder="sk-usage-…"><button>查看用量</button></div></form>
    <div class="toolbar"><p id="status" role="status" aria-live="polite">输入用量密钥即可查询。</p><button id="refresh" type="button" hidden>刷新</button></div>
    <div id="accounts"></div>
  </main>
</body>
</html>
